name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # aedes/mqtt нужны тестам релея; в рантайме игры зависимостей по-прежнему нет
      - name: Установка dev-зависимостей
        run: npm ci

      - name: Тесты движка
        run: npm test

      # сборка падает, если в бандле коллизия имён или остался import/export
      - name: Сборка одностраничника
        run: npm run build
